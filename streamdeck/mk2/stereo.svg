  <rect width="144" height="144" rx="24" fill="url(#bg)"/>
  <rect x="10" y="10" width="124" height="124" rx="20" fill="none" stroke="#f472b6" stroke-opacity="0.45" stroke-width="3"/>
  <circle cx="72" cy="58" r="34" fill="#f472b6" fill-opacity="0.16" filter="url(#shadow)"/>
  <text x="72" y="73" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800" fill="#f472b6">◎</text>
  <text x="72" y="111" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Stereo</text>
