name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
    NODE_VERSION: 24

jobs:
  test-build:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build

  visual-check:
    name: Visual canvas check
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview server
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          echo "$!" > /tmp/bloch-stereo-vite.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Verify WebGL canvas
        env:
          BLOCH_STEREO_URL: http://127.0.0.1:4173/
        run: node scripts/verify-canvas.mjs

      - name: Stop preview server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/bloch-stereo-vite.pid ]; then
            kill "$(cat /tmp/bloch-stereo-vite.pid)" || true
          fi
